<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="100%" height="100%">
  <defs>
    <linearGradient id="os_icon_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="os_icon_shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Squircle Icon -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="url(#os_icon_grad)" filter="url(#os_icon_shadow)"/>
    <!-- Outer Ring -->
    <circle cx="50" cy="50" r="28" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <!-- Inner Shutter / Diamond -->
    <path d="M50 32 L68 50 L50 68 L32 50 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="50" cy="50" r="6" fill="#2563eb"/>
  </g>

  <!-- Brand Typography "Open-Shop" -->
  <text x="130" y="74" font-family="'Open Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">Open-Shop</text>
</svg>